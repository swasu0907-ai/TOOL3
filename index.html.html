<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>個人簡易記帳本 - 收入、支出與結餘管理</title>
<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --ink: #1e293b;
  --mute: #64748b;
  --line: #e2e8f0;
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --green: #10b981;
  --green-bg: #ecfdf5;
  --red: #ef4444;
  --red-bg: #fef2f2;
  --blue-bg: #eff6ff;
  --soft: #f1f5f9;
  --radius: 12px;
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f172a;
    --card: #1e293b;
    --ink: #f1f5f9;
    --mute: #94a3b8;
    --line: #334155;
    --primary: #60a5fa;
    --primary-hover: #3b82f6;
    --green: #34d399;
    --green-bg: rgba(16, 185, 129, 0.15);
    --red: #f87171;
    --red-bg: rgba(239, 68, 68, 0.15);
    --blue-bg: rgba(59, 130, 246, 0.15);
    --soft: #111827;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", "PingFang TC", sans-serif;
  background-color: var(--bg);
  color: var(--ink);
  line-height: 1.5;
  padding: 20px;
}

.container {
  max-width: 1000px;
  margin: 0 auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}

h1 {
  font-size: 24px;
  font-weight: 700;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 10px;
}

h1 svg {
  width: 28px;
  height: 28px;
  fill: var(--primary);
}

.actions-group {
  display: flex;
  gap: 8px;
}

button {
  font: inherit;
  font-weight: 600;
  border: none;
  border-radius: 8px;
  padding: 8px 14px;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
}

.btn-primary {
  background-color: var(--primary);
  color: #fff;
}
.btn-primary:hover {
  background-color: var(--primary-hover);
}

.btn-outline {
  background-color: transparent;
  border: 1px solid var(--line);
  color: var(--ink);
}
.btn-outline:hover {
  background-color: var(--soft);
}

.btn-danger {
  background-color: var(--red-bg);
  color: var(--red);
}
.btn-danger:hover {
  background-color: var(--red);
  color: #fff;
}

/* KPI Cards */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.kpi-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}

.kpi-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; width: 4px; height: 100%;
}
.kpi-card.balance::before { background-color: var(--primary); }
.kpi-card.income::before { background-color: var(--green); }
.kpi-card.expense::before { background-color: var(--red); }

.kpi-title {
  font-size: 13px;
  color: var(--mute);
  font-weight: 600;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.kpi-value {
  font-size: 28px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.kpi-card.balance .kpi-value { color: var(--primary); }
.kpi-card.income .kpi-value { color: var(--green); }
.kpi-card.expense .kpi-value { color: var(--red); }

/* Main Grid Layout */
.main-grid {
  display: grid;
  grid-template-columns: 360px 1fr;
  gap: 24px;
}

@media (max-width: 850px) {
  .main-grid {
    grid-template-columns: 1fr;
  }
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
}

.card h2 {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 16px;
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* Form Styles */
.form-group {
  margin-bottom: 14px;
}

label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--mute);
  margin-bottom: 6px;
}

input, select, textarea {
  width: 100%;
  font: inherit;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--card);
  color: var(--ink);
  transition: border-color 0.2s;
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
}

.type-selector {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 14px;
}

.type-btn {
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--card);
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
  color: var(--mute);
}

.type-btn.active.income {
  background-color: var(--green-bg);
  border-color: var(--green);
  color: var(--green);
}

.type-btn.active.expense {
  background-color: var(--red-bg);
  border-color: var(--red);
  color: var(--red);
}

.btn-full {
  width: 100%;
  justify-content: center;
  padding: 12px;
  font-size: 15px;
  margin-top: 6px;
}

/* Filter & Controls */
.filter-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
}

.filter-group {
  display: flex;
  gap: 6px;
}

.filter-chip {
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--mute);
  cursor: pointer;
  transition: all 0.2s;
}

.filter-chip.active {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}

.search-box {
  max-width: 200px;
}

/* Table Styles */
.table-responsive {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 14px;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid var(--line);
}

th {
  font-size: 12px;
  font-weight: 600;
  color: var(--mute);
  background-color: var(--soft);
}

tr:hover td {
  background-color: var(--soft);
}

.badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
}

.badge.income {
  background-color: var(--green-bg);
  color: var(--green);
}

.badge.expense {
  background-color: var(--red-bg);
  color: var(--red);
}

.amount {
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.amount.income { color: var(--green); }
.amount.expense { color: var(--red); }

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--mute);
}

.empty-state svg {
  width: 48px;
  height: 48px;
  stroke: var(--mute);
  margin-bottom: 12px;
  opacity: 0.5;
}

.action-btns {
  display: flex;
  gap: 6px;
}

.btn-icon {
  background: transparent;
  border: none;
  padding: 4px 8px;
  cursor: pointer;
  color: var(--mute);
  border-radius: 4px;
}
.btn-icon:hover {
  background: var(--line);
  color: var(--red);
}

/* Footer note */
.footer-note {
  text-align: center;
  margin-top: 30px;
  font-size: 12px;
  color: var(--mute);
}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>
      <svg viewBox="0 0 24 24"><path d="M21 18V6C21 4.89 20.1 4 19 4H5C3.89 4 3 4.89 3 6V18C3 19.1 3.89 20 5 20H19C20.1 20 21 19.1 21 18ZM19 18H5V6H19V18ZM12 8C9.79 8 8 9.79 8 12C8 14.21 9.79 16 12 16C14.21 16 16 14.21 16 12C16 9.79 14.21 8 12 8ZM12 14C10.9 14 10 13.1 10 12C10 10.9 10.9 10 12 10C13.1 10 14 10.9 14 12C14 13.1 13.1 14 12 14Z"/></svg>
      簡易記帳本
    </h1>
    <div class="actions-group">
      <button class="btn-outline" onclick="exportData()">
        💾 匯出資料
      </button>
      <button class="btn-outline" onclick="triggerImport()">
        📂 匯入資料
      </button>
      <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
      <button class="btn-danger" onclick="clearAllData()">
        🗑️ 清空重置
      </button>
    </div>
  </header>

  <!-- KPI Cards -->
  <div class="kpi-grid">
    <div class="kpi-card balance">
      <div class="kpi-title">總結餘 (Balance)</div>
      <div class="kpi-value" id="kpiBalance">$0</div>
    </div>
    <div class="kpi-card income">
      <div class="kpi-title">總收入 (Total Income)</div>
      <div class="kpi-value" id="kpiIncome">$0</div>
    </div>
    <div class="kpi-card expense">
      <div class="kpi-title">總支出 (Total Expense)</div>
      <div class="kpi-value" id="kpiExpense">$0</div>
    </div>
  </div>

  <div class="main-grid">
    <!-- Form Card -->
    <div class="card">
      <h2>新增收支紀錄</h2>
      <form id="transactionForm" onsubmit="addTransaction(event)">
        <div class="type-selector">
          <div class="type-btn income" id="typeIncomeBtn" onclick="setType('income')">收入</div>
          <div class="type-btn expense active" id="typeExpenseBtn" onclick="setType('expense')">支出</div>
        </div>
        <input type="hidden" id="txType" value="expense">

        <div class="form-group">
          <label for="txDate">日期</label>
          <input type="date" id="txDate" required>
        </div>

        <div class="form-group">
          <label for="txCategory">類別</label>
          <select id="txCategory" required>
            <!-- Dynamic populated categories -->
          </select>
        </div>

        <div class="form-group">
          <label for="txAmount">金額 (NT$)</label>
          <input type="number" id="txAmount" min="1" step="1" placeholder="例如: 150" required>
        </div>

        <div class="form-group">
          <label for="txNote">備註 (選填)</label>
          <textarea id="txNote" rows="2" placeholder="例如: 午餐便當、捷運車費..."></textarea>
        </div>

        <button type="submit" class="btn-primary btn-full">
          ➕ 新增紀錄
        </button>
      </form>
    </div>

    <!-- List & Table Card -->
    <div class="card">
      <h2>
        <span>收支明細清單</span>
        <span id="txCountBadge" style="font-size:12px; font-weight:normal; color:var(--mute);">共 0 筆</span>
      </h2>

      <div class="filter-bar">
        <div class="filter-group">
          <div class="filter-chip active" onclick="setFilter('all', this)">全部</div>
          <div class="filter-chip" onclick="setFilter('income', this)">僅收入</div>
          <div class="filter-chip" onclick="setFilter('expense', this)">僅支出</div>
        </div>
        <div>
          <input type="text" class="search-box" id="searchKeyword" placeholder="搜尋備註..." oninput="renderTable()">
        </div>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>日期</th>
              <th>類型</th>
              <th>類別</th>
              <th>備註</th>
              <th style="text-align: right;">金額</th>
              <th style="text-align: center; width: 60px;">操作</th>
            </tr>
          </thead>
          <tbody id="transactionTableBody">
            <!-- Dynamic rows -->
          </tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state" style="display: none;">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
        </svg>
        <p>目前尚無收支紀錄，請從左側新增！</p>
      </div>
    </div>
  </div>

  <div class="footer-note">
    簡易記帳本 • 資料自動儲存於您的瀏覽器中 (LocalStorage)
  </div>
</div>

<script>
// Categories definition
const categories = {
  expense: ['餐飲美食', '交通通勤', '購物消費', '居家生活', '娛樂休閒', '醫療保健', '教育學習', '其他支出'],
  income: ['薪資收入', '獎金紅利', '投資理財', '兼職外快', '其他收入']
};

let currentType = 'expense';
let currentFilter = 'all';
let transactions = [];

// Initialize
document.addEventListener('DOMContentLoaded', () => {
  // Set today's date
  document.getElementById('txDate').valueAsDate = new Date();
  
  // Load from LocalStorage
  const saved = localStorage.getItem('simple_accounting_txs');
  if (saved) {
    try {
      transactions = JSON.parse(saved);
    } catch (e) {
      transactions = [];
    }
  } else {
    // Demo initial data if empty
    transactions = [
      { id: '1', type: 'income', date: getTodayDateString(-2), category: '薪資收入', amount: 35000, note: '本月薪資' },
      { id: '2', type: 'expense', date: getTodayDateString(-1), category: '餐飲美食', amount: 280, note: '晚餐聚餐' },
      { id: '3', type: 'expense', date: getTodayDateString(0), category: '交通通勤', amount: 120, note: '捷運悠遊卡加值' }
    ];
    saveData();
  }

  updateCategoryOptions();
  renderAll();
});

function getTodayDateString(offsetDays = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  return d.toISOString().split('T')[0];
}

function setType(type) {
  currentType = type;
  document.getElementById('txType').value = type;
  
  const incomeBtn = document.getElementById('typeIncomeBtn');
  const expenseBtn = document.getElementById('typeExpenseBtn');
  
  if (type === 'income') {
    incomeBtn.className = 'type-btn active income';
    expenseBtn.className = 'type-btn expense';
  } else {
    incomeBtn.className = 'type-btn income';
    expenseBtn.className = 'type-btn active expense';
  }
  
  updateCategoryOptions();
}

function updateCategoryOptions() {
  const select = document.getElementById('txCategory');
  select.innerHTML = '';
  const cats = categories[currentType];
  cats.forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.textContent = cat;
    select.appendChild(opt);
  });
}

function addTransaction(e) {
  e.preventDefault();
  
  const type = document.getElementById('txType').value;
  const date = document.getElementById('txDate').value;
  const category = document.getElementById('txCategory').value;
  const amount = parseFloat(document.getElementById('txAmount').value);
  const note = document.getElementById('txNote').value.trim();

  if (!date || !category || isNaN(amount) || amount <= 0) return;

  const newTx = {
    id: Date.now().toString(),
    type,
    date,
    category,
    amount,
    note
  };

  transactions.unshift(newTx);
  saveData();
  renderAll();

  // Reset form amount and note
  document.getElementById('txAmount').value = '';
  document.getElementById('txNote').value = '';
}

function deleteTransaction(id) {
  if (confirm('確定要刪除這筆紀錄嗎？')) {
    transactions = transactions.filter(t => t.id !== id);
    saveData();
    renderAll();
  }
}

function setFilter(filter, el) {
  currentFilter = filter;
  document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.remove('active'));
  el.classList.add('active');
  renderTable();
}

function saveData() {
  localStorage.setItem('simple_accounting_txs', JSON.stringify(transactions));
}

function renderAll() {
  renderKPIs();
  renderTable();
}

function renderKPIs() {
  let totalIncome = 0;
  let totalExpense = 0;

  transactions.forEach(t => {
    if (t.type === 'income') {
      totalIncome += t.amount;
    } else {
      totalExpense += t.amount;
    }
  });

  const balance = totalIncome - totalExpense;

  document.getElementById('kpiIncome').textContent = formatCurrency(totalIncome);
  document.getElementById('kpiExpense').textContent = formatCurrency(totalExpense);
  
  const balanceEl = document.getElementById('kpiBalance');
  balanceEl.textContent = formatCurrency(balance);
  
  // Style balance card based on sign
  const balanceCard = balanceEl.closest('.kpi-card');
  if (balance < 0) {
    balanceCard.style.setProperty('--primary', 'var(--red)');
  } else {
    balanceCard.style.removeProperty('--primary');
  }
}

function renderTable() {
  const tbody = document.getElementById('transactionTableBody');
  const emptyState = document.getElementById('emptyState');
  const searchKeyword = document.getElementById('searchKeyword').value.toLowerCase();

  // Filter
  let filtered = transactions.filter(t => {
    if (currentFilter === 'income' && t.type !== 'income') return false;
    if (currentFilter === 'expense' && t.type !== 'expense') return false;
    
    if (searchKeyword) {
      const matchNote = t.note.toLowerCase().includes(searchKeyword);
      const matchCat = t.category.toLowerCase().includes(searchKeyword);
      if (!matchNote && !matchCat) return false;
    }
    return true;
  });

  document.getElementById('txCountBadge.textContent') // placeholder logic fix below
  document.getElementById('txCountBadge').textContent = `符合條件 ${filtered.length} 筆`;

  if (filtered.length === 0) {
    tbody.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }

  emptyState.style.display = 'none';
  let html = '';

  filtered.forEach(t => {
    const isInc = t.type === 'income';
    const typeLabel = isInc ? '收入' : '支出';
    const badgeClass = isInc ? 'income' : 'expense';
    const amountClass = isInc ? 'income' : 'expense';
    const sign = isInc ? '+' : '-';

    html += `
      <tr>
        <td>${t.date}</td>
        <td><span class="badge ${badgeClass}">${typeLabel}</span></td>
        <td>${t.category}</td>
        <td style="color:var(--mute);">${t.note || '-'}</td>
        <td class="amount ${amountClass}" style="text-align: right;">${sign}${formatCurrency(t.amount).replace('$', '')}</td>
        <td style="text-align: center;">
          <button class="btn-icon" onclick="deleteTransaction('${t.id}')" title="刪除">✖</button>
        </td>
      </tr>
    `;
  });

  tbody.innerHTML = html;
}

function formatCurrency(amount) {
  return '$' + amount.toLocaleString('en-US');
}

function clearAllData() {
  if (confirm('警告：確定要清空所有記帳紀錄嗎？此操作無法復原！')) {
    transactions = [];
    saveData();
    renderAll();
  }
}

function exportData() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(transactions, null, 2));
  const dlAnchorElem = document.createElement('a');
  dlAnchorElem.setAttribute("href", dataStr);
  dlAnchorElem.setAttribute("download", `accounting_backup_${new Date().toISOString().split('T')[0]}.json`);
  dlAnchorElem.click();
}

function triggerImport() {
  document.getElementById('importFile').click();
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (Array.isArray(imported)) {
        if (confirm(`確定要匯入 ${imported.length} 筆紀錄嗎？這將會覆蓋現有資料。`)) {
          transactions = imported;
          saveData();
          renderAll();
          alert('匯入成功！');
        }
      } else {
        alert('檔案格式錯誤：不是有效的記帳資料。');
      }
    } catch (err) {
      alert('解析 JSON 檔案失敗。');
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}
</script>

</body>
</html>
